services:
  app:
    build: .
    platform: linux/amd64
    container_name: express_app
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    env_file:
      - .env
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27018"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: